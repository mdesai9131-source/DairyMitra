version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dairymitra_postgres
    restart: always
    environment:
      POSTGRES_DB: dairymitra_db
      POSTGRES_USER: dairymitra_user
      POSTGRES_PASSWORD: dairymitra_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dairymitra_backend
    restart: always
    depends_on:
      - db
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://dairymitra_user:dairymitra_pass@db:5432/dairymitra_db
      SECRET_KEY: change-this-in-production-long-random-string
      JWT_SECRET_KEY: change-this-jwt-secret-in-production-long
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  postgres_data:
